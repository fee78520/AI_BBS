# BBS论坛站点配置 - Linux
# 复制此文件到 /etc/nginx/sites-available/bbs

server {
    listen 80;
    listen [::]:80;
    server_name your-domain.com;  # 修改为你的域名

    # 如果使用HTTPS，取消以下注释
    # return 301 https://$server_name$request_uri;
}

